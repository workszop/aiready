<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Readiness Assessment</title>
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap" />
    <style>
        /* ── Quantica Design Tokens ──────────────────────────────────────────── */
        :root {
            --quantica-pink:    #C41E54;
            --rose-pink:        #FF4D9A;
            --deep-berry:       #8A004C;
            --near-black:       #111111;
            --white:            #FFFFFF;

            --magenta-tint:     #FFE6F1;
            --cool-gray:        #E6E8EC;
            --light-gray:       #F5F6F8;
            --silver:           #D1D5DB;

            --violet-primary:   #7030A0;
            --violet-deep:      #4F1F75;
            --mist:             #F4EEFA;

            --amber:            #FFC107;

            --fg-1:             #111111;
            --fg-2:             #3A3A42;
            --fg-3:             #6B6B76;
            --fg-4:             #9A9AA5;
            --fg-on-pink:       #FFFFFF;
            --fg-brand:         #C41E54;

            --bg-1:             #FFFFFF;
            --bg-2:             #F5F6F8;

            --border-1:         #E6E8EC;
            --border-2:         #D1D5DB;
            --border-brand:     #C41E54;
            --border-focus:     #FF4D9A;

            --status-success:   #00A37A;
            --status-warning:   #FFC107;
            --status-error:     #DC2626;

            --grad-magenta:     linear-gradient(90deg, #C41E54 0%, #FF20A1 50%, #7030A0 100%);

            --font-sans:        "Satoshi", "Inter", system-ui, -apple-system, sans-serif;
            --font-mono:        "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;

            --fs-h1:            56px;
            --fs-h2:            28px;
            --fs-h3:            20px;
            --fs-body-lg:       18px;
            --fs-body:          14px;
            --fs-caption:       12px;

            --lh-h1:            1.1;
            --lh-h2:            1.25;
            --lh-h3:            1.4;
            --lh-body:          1.65;

            --tracking-h1:      -0.01em;
            --tracking-caps:    0.08em;

            --fw-regular:       400;
            --fw-medium:        500;
            --fw-bold:          700;

            --space-1:  4px;
            --space-2:  8px;
            --space-3:  12px;
            --space-4:  16px;
            --space-5:  24px;
            --space-6:  32px;
            --space-7:  40px;
            --space-8:  48px;
            --space-9:  64px;
            --space-10: 96px;

            --radius-xs:   4px;
            --radius-sm:   6px;
            --radius-md:   10px;
            --radius-lg:   16px;
            --radius-pill: 999px;

            --shadow-xs:        0 1px 2px rgba(17,17,17,0.04);
            --shadow-sm:        0 2px 6px rgba(17,17,17,0.06);
            --shadow-md:        0 8px 24px rgba(17,17,17,0.08);
            --shadow-pink-soft: 0 6px 18px rgba(196,30,84,0.10);
            --inner-hairline:   inset 0 0 0 1px rgba(17,17,17,0.06);

            --ease-standard:  cubic-bezier(0.2, 0.6, 0.2, 1);
            --ease-out-soft:  cubic-bezier(0.16, 1, 0.3, 1);
            --dur-1: 120ms;
            --dur-2: 200ms;
            --dur-3: 320ms;
        }

        /* ── Reset & base ────────────────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html {
            font-family: var(--font-sans);
            font-size: 16px;
            color: var(--fg-1);
            background: var(--bg-2);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            scroll-behavior: smooth;
        }

        body { min-height: 100vh; }

        /* ── Scroll progress ─────────────────────────────────────────────────── */
        .scroll-indicator {
            position: fixed; top: 0; left: 0; right: 0;
            height: 3px; background: var(--border-1); z-index: 9999;
        }
        .scroll-progress {
            height: 100%;
            background: var(--grad-magenta);
            width: 0%;
            transition: width 0.1s var(--ease-standard);
        }

        /* ── Card / page wrapper ─────────────────────────────────────────────── */
        .card {
            background: var(--bg-1);
            max-width: 820px;
            margin: var(--space-7) auto;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-1);
            overflow: hidden;
            position: relative;
        }

        /* Magenta accent bar at the top */
        .card::before {
            content: '';
            display: block;
            height: 3px;
            background: var(--grad-magenta);
        }

        .card > #app-inner {
            padding: var(--space-9) var(--space-7);
        }

        /* ── Typography ──────────────────────────────────────────────────────── */
        .title {
            font-family: var(--font-sans);
            font-size: var(--fs-h1);
            line-height: var(--lh-h1);
            letter-spacing: var(--tracking-h1);
            font-weight: var(--fw-bold);
            color: var(--fg-1);
            margin-bottom: var(--space-4);
        }

        .subtitle {
            font-size: var(--fs-body-lg);
            line-height: var(--lh-body);
            color: var(--fg-2);
            margin-bottom: var(--space-6);
            max-width: 56ch;
        }

        .welcome-screen .subtitle { margin-left: auto; margin-right: auto; }

        h3 {
            font-size: var(--fs-caption);
            font-weight: var(--fw-medium);
            text-transform: uppercase;
            letter-spacing: var(--tracking-caps);
            color: var(--fg-brand);
            margin: var(--space-7) 0 var(--space-4);
        }

        /* ── Progress bar ────────────────────────────────────────────────────── */
        .progress {
            height: 4px;
            background: var(--border-1);
            border-radius: var(--radius-pill);
            margin: var(--space-4) 0;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: var(--grad-magenta);
            border-radius: var(--radius-pill);
            transition: width var(--dur-3) var(--ease-out-soft);
        }

        /* ── Section navigator ───────────────────────────────────────────────── */
        .section-navigator {
            display: flex;
            gap: var(--space-1);
            margin-bottom: var(--space-6);
            overflow-x: auto;
            padding-bottom: var(--space-1);
        }

        .section-indicator {
            flex: 1;
            min-width: 100px;
            padding: var(--space-3) var(--space-3);
            border-radius: var(--radius-md);
            text-align: center;
            font-size: 11px;
            font-weight: var(--fw-medium);
            background: var(--bg-2);
            color: var(--fg-3);
            border: 1px solid var(--border-1);
            transition: all var(--dur-2) var(--ease-standard);
            cursor: pointer;
            line-height: 1.4;
        }

        .section-indicator:hover {
            background: var(--magenta-tint);
            color: var(--fg-brand);
            border-color: var(--border-brand);
        }

        .section-indicator.current {
            background: var(--quantica-pink);
            color: var(--fg-on-pink);
            border-color: var(--quantica-pink);
            box-shadow: var(--shadow-pink-soft);
        }

        .section-indicator.completed {
            background: var(--mist);
            color: var(--violet-primary);
            border-color: var(--violet-primary);
        }

        /* ── Question ────────────────────────────────────────────────────────── */
        .question {
            margin: var(--space-7) 0;
        }

        .question-header { margin-bottom: var(--space-3); }

        .question-number {
            font-size: var(--fs-caption);
            font-weight: var(--fw-medium);
            text-transform: uppercase;
            letter-spacing: var(--tracking-caps);
            color: var(--fg-brand);
        }

        /* ── Buttons — primary / secondary ───────────────────────────────────── */
        .button {
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
            padding: 10px 24px;
            border-radius: var(--radius-pill);
            font-family: var(--font-sans);
            font-size: var(--fs-body);
            font-weight: var(--fw-medium);
            cursor: pointer;
            border: 1.5px solid transparent;
            transition: background var(--dur-2) var(--ease-standard),
                        color var(--dur-2) var(--ease-standard),
                        border-color var(--dur-2) var(--ease-standard),
                        box-shadow var(--dur-2) var(--ease-standard),
                        transform var(--dur-1) var(--ease-standard);
            white-space: nowrap;
            text-decoration: none;
            background: var(--quantica-pink);
            color: var(--fg-on-pink);
            border-color: var(--quantica-pink);
            box-shadow: var(--shadow-pink-soft);
            width: 100%;
            margin: var(--space-2) 0;
            text-align: left;
            justify-content: flex-start;
        }

        .button:hover:not(:disabled) {
            background: var(--deep-berry);
            border-color: var(--deep-berry);
        }

        .button:focus-visible {
            outline: 2px solid var(--border-focus);
            outline-offset: 2px;
        }

        .button.selected {
            background: var(--deep-berry);
            border-color: var(--deep-berry);
        }

        .button.selected::after {
            content: '✓';
            margin-left: auto;
            font-weight: var(--fw-bold);
        }

        .button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            box-shadow: none;
        }

        .button.secondary {
            background: transparent;
            color: var(--quantica-pink);
            border-color: var(--quantica-pink);
            box-shadow: none;
        }

        .button.secondary:hover:not(:disabled) {
            background: var(--magenta-tint);
        }

        /* Answer option buttons — outlined default, filled when selected */
        .answer-btn {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            width: 100%;
            margin: var(--space-2) 0;
            padding: var(--space-4) var(--space-5);
            border-radius: var(--radius-md);
            font-family: var(--font-sans);
            font-size: var(--fs-body-lg);
            font-weight: var(--fw-regular);
            cursor: pointer;
            border: 1.5px solid var(--border-1);
            background: var(--bg-1);
            color: var(--fg-2);
            text-align: left;
            transition: all var(--dur-2) var(--ease-standard);
        }

        .answer-btn:hover:not(:disabled) {
            border-color: var(--border-brand);
            background: var(--magenta-tint);
            color: var(--fg-1);
            transform: translateX(4px);
        }

        .answer-btn.selected {
            background: var(--quantica-pink);
            color: var(--fg-on-pink);
            border-color: var(--quantica-pink);
            box-shadow: var(--shadow-pink-soft);
        }

        .answer-btn.selected::after {
            content: '✓';
            margin-left: auto;
            font-weight: var(--fw-bold);
        }

        .answer-btn.selected:hover {
            background: var(--deep-berry);
            border-color: var(--deep-berry);
            transform: none;
        }

        .answer-btn:focus-visible {
            outline: 2px solid var(--border-focus);
            outline-offset: 2px;
        }

        /* Nav button group */
        .button-group {
            display: flex;
            gap: var(--space-3);
            margin-top: var(--space-7);
        }

        .button-group .button {
            flex: 1;
            text-align: center;
            justify-content: center;
            margin: 0;
        }

        /* ── Welcome screen ──────────────────────────────────────────────────── */
        .welcome-screen { text-align: center; }

        .feature-list {
            text-align: left;
            margin: var(--space-6) auto;
            max-width: 460px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: var(--space-4);
            padding: var(--space-3) 0;
            border-bottom: 1px solid var(--border-1);
            font-size: var(--fs-body-lg);
            color: var(--fg-2);
        }

        .feature-item:last-child { border-bottom: none; }

        .feature-icon {
            width: 28px; height: 28px;
            background: var(--magenta-tint);
            color: var(--fg-brand);
            border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: var(--fw-bold); flex-shrink: 0;
        }

        /* ── Results grid ────────────────────────────────────────────────────── */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: var(--space-3);
            margin: var(--space-5) 0;
        }

        .result-card {
            padding: var(--space-5);
            background: var(--bg-2);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-1);
            transition: box-shadow var(--dur-2) var(--ease-standard);
        }

        .result-card:hover {
            box-shadow: var(--shadow-sm);
        }

        /* ── Score display ───────────────────────────────────────────────────── */
        .score {
            font-family: var(--font-sans);
            font-size: 80px;
            font-weight: var(--fw-bold);
            line-height: 1;
            letter-spacing: -0.03em;
            text-align: center;
            color: var(--quantica-pink);
            margin: var(--space-5) 0 var(--space-3);
        }

        /* ── Review ──────────────────────────────────────────────────────────── */
        .review-section {
            margin: var(--space-5) 0;
            padding: var(--space-5);
            background: var(--bg-2);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-1);
        }

        .review-question {
            padding: var(--space-3) 0;
            border-bottom: 1px solid var(--border-1);
            font-size: var(--fs-body-lg);
            color: var(--fg-2);
        }

        .review-question:last-child { border-bottom: none; }

        .review-answer {
            color: var(--fg-brand);
            font-weight: var(--fw-medium);
            margin-top: var(--space-1);
        }

        /* ── Recommendation cards ────────────────────────────────────────────── */
        .recommendation-card {
            margin: var(--space-3) 0;
            padding: var(--space-5);
            border-left: 3px solid var(--quantica-pink);
            background: var(--magenta-tint);
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
            font-size: var(--fs-body-lg);
            color: var(--fg-1);
            line-height: var(--lh-body);
        }

        .recommendation-card.warning {
            border-left-color: var(--status-warning);
            background: rgba(255,193,7,0.10);
        }

        .recommendation-card.danger {
            border-left-color: var(--status-error);
            background: rgba(220,38,38,0.06);
        }

        .recommendation-card.info {
            border-left-color: var(--violet-primary);
            background: var(--mist);
        }

        .recommendation-card.success {
            border-left-color: var(--status-success);
            background: rgba(0,163,122,0.08);
        }

        /* ── Download buttons ────────────────────────────────────────────────── */
        .download-buttons {
            display: flex;
            gap: var(--space-3);
            margin: var(--space-5) 0;
            justify-content: center;
        }

        .download-buttons .button {
            width: auto;
            flex: 0 1 auto;
            min-width: 120px;
            justify-content: center;
        }

        .icon-button { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); }

        /* ── Help / keyboard hint ────────────────────────────────────────────── */
        .help-text {
            margin-top: var(--space-5);
            padding: var(--space-4) var(--space-5);
            background: var(--bg-2);
            border: 1px solid var(--border-1);
            border-radius: var(--radius-md);
            font-size: var(--fs-body);
            color: var(--fg-3);
            text-align: center;
        }

        .kbd {
            background: var(--bg-1);
            border: 1px solid var(--border-2);
            border-radius: var(--radius-xs);
            padding: 2px 7px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--fg-2);
        }

        /* ── Animations ──────────────────────────────────────────────────────── */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        #app-inner { animation: fadeIn var(--dur-3) var(--ease-out-soft); }

        .question { animation: fadeIn var(--dur-2) var(--ease-standard); }

        /* ── Responsive ──────────────────────────────────────────────────────── */
        @media (max-width: 860px) {
            .card { margin: 0; border-radius: 0; border-left: none; border-right: none; }
        }

        @media (max-width: 640px) {
            .card > #app-inner { padding: var(--space-7) var(--space-5); }
            .title { font-size: 2rem; }
            .button-group { flex-direction: column; }
            .section-indicator { min-width: 72px; font-size: 10px; }
            .results-grid { grid-template-columns: 1fr; }
            .score { font-size: 64px; }
        }
    </style>
</head>
<body>
    <!-- Scroll Progress Indicator -->
    <div class="scroll-indicator">
        <div class="scroll-progress" id="scrollProgress"></div>
    </div>

    <div class="card">
        <div id="app" id="app-inner"></div>
    </div>

    <script>
        class Survey {
            constructor() {
                this.app = document.getElementById('app');
                this.questions = {};
                this.currentSection = '';
                this.answers = {};
                this.answerDetails = {}; // Store question text and selected option text
                this.showResults = false;
                this.showWelcome = true;
                this.showReview = false;
                this.currentQuestionIndex = 0;
                this.oneQuestionMode = false;
                this.hasSavedData = false;
                this.checkForSavedData();
            }

            checkForSavedData() {
                try {
                    const savedAnswers = localStorage.getItem('aiready_answers');
                    if (savedAnswers) {
                        const parsed = JSON.parse(savedAnswers);
                        this.hasSavedData = Object.keys(parsed).length > 0;
                        if (this.hasSavedData) {
                            this.answers = parsed;
                            const savedDetails = localStorage.getItem('aiready_details');
                            if (savedDetails) {
                                this.answerDetails = JSON.parse(savedDetails);
                            }
                        }
                    }
                } catch (e) {
                    console.error('Error loading saved data:', e);
                    this.hasSavedData = false;
                }
            }

            loadFromLocalStorage() {
                const savedAnswers = localStorage.getItem('aiready_answers');
                const savedDetails = localStorage.getItem('aiready_details');
                const savedSection = localStorage.getItem('aiready_section');
                const savedIndex = localStorage.getItem('aiready_index');

                if (savedAnswers) this.answers = JSON.parse(savedAnswers);
                if (savedDetails) this.answerDetails = JSON.parse(savedDetails);
                if (savedSection) this.currentSection = savedSection;
                if (savedIndex) this.currentQuestionIndex = parseInt(savedIndex);

                this.showWelcome = false;
            }

            async initialize() {
                try {
                    const response = await fetch('questions.txt');
                    const text = await response.text();
                    this.questions = this.parseQuestions(text);
                    if (!this.currentSection) {
                        this.currentSection = Object.keys(this.questions)[0];
                    }
                    this.setupKeyboardNavigation();
                    this.render();
                } catch (error) {
                    console.error('Error loading questions:', error);
                }
            }

            parseQuestions(text) {
                const sections = {};
                let currentSection = '';

                text.split('\n').forEach(line => {
                    if (line.startsWith('#')) {
                        currentSection = line.substring(1).trim();
                        sections[currentSection] = [];
                    } else if (line.trim() && currentSection) {
                        const [question, ...options] = line.split('|');
                        if (question && options.length) {
                            sections[currentSection].push({
                                id: `${currentSection}-${sections[currentSection].length + 1}`,
                                text: question.trim(),
                                options: options.map(o => o.trim()),
                                scores: options.map((_, i) => options.length - i)
                            });
                        }
                    }
                });

                return sections;
            }

            setupKeyboardNavigation() {
                document.addEventListener('keydown', (e) => {
                    if (this.showWelcome || this.showResults) return;

                    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                        e.preventDefault();
                        this.nextQuestion();
                    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                        e.preventDefault();
                        this.previousQuestion();
                    } else if (e.key >= '1' && e.key <= '5') {
                        e.preventDefault();
                        this.selectAnswerByNumber(parseInt(e.key) - 1);
                    }
                });
            }

            selectAnswerByNumber(index) {
                if (!this.oneQuestionMode) return;

                const currentQuestions = this.questions[this.currentSection];
                const question = currentQuestions[this.currentQuestionIndex];
                if (question && question.options[index]) {
                    this.handleAnswer(question.id, question.scores[index], question, index);
                }
            }

            nextQuestion() {
                if (!this.oneQuestionMode) return;

                const currentQuestions = this.questions[this.currentSection];
                if (this.currentQuestionIndex < currentQuestions.length - 1) {
                    this.currentQuestionIndex++;
                    this.render();
                } else {
                    this.nextSection();
                }
            }

            previousQuestion() {
                if (!this.oneQuestionMode) return;

                if (this.currentQuestionIndex > 0) {
                    this.currentQuestionIndex--;
                    this.render();
                } else {
                    this.previousSection();
                }
            }

            previousSection() {
                const sections = Object.keys(this.questions);
                const currentIndex = sections.indexOf(this.currentSection);

                if (currentIndex > 0) {
                    this.currentSection = sections[currentIndex - 1];
                    const prevSectionQuestions = this.questions[this.currentSection];
                    this.currentQuestionIndex = prevSectionQuestions.length - 1;
                    this.render();
                }
            }

            saveToLocalStorage() {
                localStorage.setItem('aiready_answers', JSON.stringify(this.answers));
                localStorage.setItem('aiready_details', JSON.stringify(this.answerDetails));
                localStorage.setItem('aiready_section', this.currentSection);
                localStorage.setItem('aiready_index', this.currentQuestionIndex.toString());
            }

            clearLocalStorage() {
                localStorage.removeItem('aiready_answers');
                localStorage.removeItem('aiready_details');
                localStorage.removeItem('aiready_section');
                localStorage.removeItem('aiready_index');
            }

            getScoreColor(score) {
                if (score >= 80) return '#00A37A';
                if (score >= 60) return '#7030A0';
                if (score >= 40) return '#C41E54';
                if (score >= 20) return '#FFC107';
                return '#DC2626';
            }

            getScoreLabel(score) {
                if (score >= 80) return 'Wysoka gotowość';
                if (score >= 60) return 'Dobra gotowość';
                if (score >= 40) return 'Średnia gotowość';
                if (score >= 20) return 'Niska gotowość';
                return 'Bardzo niska gotowość';
            }

            calculateScore(section) {
                const sectionData = this.questions[section];
                const sectionAnswers = sectionData
                    .map(q => this.answers[q.id])
                    .filter(score => score !== undefined);

                if (sectionAnswers.length === 0) return 0;

                const actualScore = sectionAnswers.reduce((sum, score) => sum + score, 0);
                const maxScore = sectionData.reduce((sum, q) => sum + q.scores[0], 0); // q.scores[0] is the highest score for each question
                return (actualScore / maxScore) * 100;
            }

            calculateProgress() {
                const totalQuestions = Object.values(this.questions)
                    .reduce((sum, section) => sum + section.length, 0);
                const answeredQuestions = Object.keys(this.answers).length;
                return (answeredQuestions / totalQuestions) * 100;
            }

            getTotalQuestions() {
                return Object.values(this.questions)
                    .reduce((sum, section) => sum + section.length, 0);
            }

            isSectionCompleted(section) {
                const sectionData = this.questions[section];
                return sectionData.every(q => this.answers[q.id] !== undefined);
            }

            getRecommendations(score, section) {
                const recommendations = [];

                if (score >= 80) {
                    recommendations.push({
                        type: 'success',
                        text: `Doskonała gotowość w obszarze "${section}". Kontynuuj dobre praktyki i dziel się swoim doświadczeniem.`
                    });
                } else if (score >= 60) {
                    recommendations.push({
                        type: 'info',
                        text: `Dobra gotowość w obszarze "${section}". Zidentyfikuj obszary do poprawy i stwórz plan działania.`
                    });
                } else if (score >= 40) {
                    recommendations.push({
                        type: 'warning',
                        text: `Średnia gotowość w obszarze "${section}". Zalecane są inwestycje w szkolenia i infrastrukturę.`
                    });
                } else {
                    recommendations.push({
                        type: 'danger',
                        text: `Niska gotowość w obszarze "${section}". Wymaga natychmiastowej uwagi i zasobów.`
                    });
                }

                return recommendations;
            }

            renderSectionNavigator() {
                const sections = Object.keys(this.questions);
                return `
                    <div class="section-navigator">
                        ${sections.map((section, index) => {
                            const isCurrent = section === this.currentSection;
                            const isCompleted = this.isSectionCompleted(section);
                            const classes = ['section-indicator'];
                            if (isCurrent) classes.push('current');
                            else if (isCompleted) classes.push('completed');

                            return `
                                <div class="${classes.join(' ')}" onclick="survey.goToSection('${section}')">
                                    <div style="font-size: 10px; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.06em;">Część ${index + 1}</div>
                                    <div style="margin-top: 2px;">${section}</div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            }

            goToSection(section) {
                this.currentSection = section;
                this.currentQuestionIndex = 0;
                this.render();
            }

            handleAnswer(id, score, question, optionIndex) {
                this.answers[id] = score;
                this.answerDetails[id] = {
                    question: question.text,
                    answer: question.options[optionIndex],
                    score: score,
                    section: this.currentSection
                };
                this.saveToLocalStorage();

                if (this.oneQuestionMode) {
                    this.nextQuestion();
                } else {
                    this.render();
                }
            }

            nextSection() {
                const sections = Object.keys(this.questions);
                const currentIndex = sections.indexOf(this.currentSection);

                if (currentIndex < sections.length - 1) {
                    this.currentSection = sections[currentIndex + 1];
                    this.currentQuestionIndex = 0;
                } else {
                    this.showReview = true;
                }
                this.render();
            }

            continueSurvey() {
                this.loadFromLocalStorage();
                this.render();
            }

            startFresh() {
                this.clearLocalStorage();
                this.answers = {};
                this.answerDetails = {};
                this.hasSavedData = false;
                this.render();
            }

            startSurvey(oneQuestionMode = false) {
                this.showWelcome = false;
                this.oneQuestionMode = oneQuestionMode;
                this.render();
            }

            reset() {
                this.answers = {};
                this.answerDetails = {};
                this.showResults = false;
                this.showWelcome = true;
                this.showReview = false;
                this.currentSection = Object.keys(this.questions)[0];
                this.currentQuestionIndex = 0;
                this.hasSavedData = false;
                this.clearLocalStorage();
                this.render();
            }

            downloadJSON() {
                const data = {
                    timestamp: new Date().toISOString(),
                    answers: this.answerDetails,
                    scores: {}
                };

                Object.keys(this.questions).forEach(section => {
                    data.scores[section] = this.calculateScore(section);
                });

                const overallScore = Object.values(data.scores).reduce((a, b) => a + b, 0) / Object.keys(data.scores).length;
                data.overallScore = overallScore;

                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `ai-readiness-${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                URL.revokeObjectURL(url);
            }

            downloadCSV() {
                let csv = 'Sekcja,Pytanie,Odpowiedź,Wynik\n';

                Object.values(this.answerDetails).forEach(detail => {
                    csv += `"${detail.section}","${detail.question}","${detail.answer}",${detail.score}\n`;
                });

                csv += '\n\nPodsumowanie wyników\n';
                csv += 'Sekcja,Wynik %\n';
                Object.keys(this.questions).forEach(section => {
                    const score = this.calculateScore(section);
                    csv += `"${section}",${Math.round(score)}\n`;
                });

                const overallScore = Object.keys(this.questions)
                    .reduce((sum, sec) => sum + this.calculateScore(sec), 0) / Object.keys(this.questions).length;
                csv += `\n"Wynik ogólny",${Math.round(overallScore)}\n`;

                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `ai-readiness-${new Date().toISOString().split('T')[0]}.csv`;
                a.click();
                URL.revokeObjectURL(url);
            }

            renderWelcome() {
                const totalQuestions = this.getTotalQuestions();
                const estimatedTime = Math.ceil(totalQuestions * 0.5);

                if (this.hasSavedData) {
                    const savedAnswersCount = Object.keys(this.answers).length;
                    return `
                        <div class="welcome-screen">
                            <div style="font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-brand); margin-bottom: 16px;">Ocena gotowości</div>
                            <h1 class="title">Twoja ankieta czeka</h1>
                            <p class="subtitle">
                                Znaleziono zapisaną ankietę z ${savedAnswersCount} odpowiedziami.
                                Czy chcesz kontynuować czy zacząć od nowa?
                            </p>

                            <div class="button-group" style="justify-content: center; max-width: 480px; margin: 0 auto;">
                                <button class="button" style="width: auto; flex: 1;" onclick="survey.continueSurvey()">
                                    Kontynuuj ankietę
                                </button>
                                <button class="button secondary" style="width: auto; flex: 1;" onclick="survey.startFresh()">
                                    Zacznij od nowa
                                </button>
                            </div>
                        </div>
                    `;
                }

                return `
                    <div class="welcome-screen">
                        <div style="font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-brand); margin-bottom: 16px;">AI w samorządzie</div>
                        <h1 class="title">Ocena Gotowości AI</h1>
                        <p class="subtitle">
                            Narzędzie do oceny gotowości miasta na wdrożenie sztucznej inteligencji.
                            Zidentyfikuj mocne strony i obszary wymagające uwagi.
                        </p>

                        <div class="feature-list">
                            <div class="feature-item">
                                <div class="feature-icon">→</div>
                                <div>${totalQuestions} pytań w ${Object.keys(this.questions).length} kategoriach</div>
                            </div>
                            <div class="feature-item">
                                <div class="feature-icon">~</div>
                                <div>Szacowany czas: ~${estimatedTime} minut</div>
                            </div>
                            <div class="feature-item">
                                <div class="feature-icon">↓</div>
                                <div>Automatyczny zapis postępu</div>
                            </div>
                            <div class="feature-item">
                                <div class="feature-icon">%</div>
                                <div>Szczegółowy raport z rekomendacjami</div>
                            </div>
                            <div class="feature-item">
                                <div class="feature-icon">↗</div>
                                <div>Eksport wyników (CSV, JSON)</div>
                            </div>
                        </div>

                        <div class="button-group" style="justify-content: center; max-width: 480px; margin: 0 auto;">
                            <button class="button" style="width: auto; flex: 1;" onclick="survey.startSurvey(true)">
                                Pytanie po pytaniu
                            </button>
                            <button class="button secondary" style="width: auto; flex: 1;" onclick="survey.startSurvey(false)">
                                Wszystkie pytania
                            </button>
                        </div>

                        <div class="help-text" style="margin-top: 32px;">
                            <strong>Wskazówka:</strong> Tryb &ldquo;Pytanie po pytaniu&rdquo; pozwala skupić się na jednym pytaniu naraz.
                            Użyj strzałek lub klawiszy <span class="kbd">1</span>&ndash;<span class="kbd">5</span> do nawigacji.
                        </div>
                    </div>
                `;
            }

            renderReview() {
                const sections = Object.keys(this.questions);

                return `
                    <div style="font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-brand); margin-bottom: 16px;">Przegląd</div>
                    <h2 class="title">Twoje odpowiedzi</h2>
                    <p class="subtitle">Sprawdź swoje odpowiedzi przed wyświetleniem wyników.</p>

                    ${sections.map(section => {
                        const sectionQuestions = this.questions[section];
                        return `
                            <div class="review-section">
                                <h3 style="margin-top: 0; margin-bottom: 8px;">${section}</h3>
                                ${sectionQuestions.map(q => {
                                    const detail = this.answerDetails[q.id];
                                    return detail ? `
                                        <div class="review-question">
                                            <div style="font-weight: 500; color: var(--fg-1);">${detail.question}</div>
                                            <div class="review-answer">→ ${detail.answer}</div>
                                        </div>
                                    ` : '';
                                }).join('')}
                            </div>
                        `;
                    }).join('')}

                    <div class="button-group">
                        <button class="button secondary" onclick="survey.showReview = false; survey.render()">
                            ← Wróć do ankiety
                        </button>
                        <button class="button" onclick="survey.showResults = true; survey.showReview = false; survey.render()">
                            Pokaż wyniki →
                        </button>
                    </div>
                `;
            }

            renderResults() {
                const sections = Object.keys(this.questions);
                const overallScore = sections
                    .reduce((sum, sec) => sum + this.calculateScore(sec), 0) / sections.length;

                const allRecommendations = [];
                sections.forEach(section => {
                    const score = this.calculateScore(section);
                    allRecommendations.push(...this.getRecommendations(score, section));
                });

                return `
                    <div style="font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-brand); margin-bottom: 16px;">Wyniki</div>
                    <h1 class="title">Ocena Gotowości AI</h1>

                    <div class="score">${Math.round(overallScore)}%</div>
                    <div style="text-align: center; margin-bottom: 32px; font-size: 14px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-3);">
                        ${this.getScoreLabel(overallScore)}
                    </div>

                    <div class="download-buttons">
                        <button class="button icon-button" onclick="survey.downloadJSON()">
                            JSON
                        </button>
                        <button class="button secondary icon-button" onclick="survey.downloadCSV()">
                            CSV
                        </button>
                    </div>

                    <h3>Wyniki szczegółowe</h3>
                    <div class="results-grid">
                        ${sections.map(section => {
                            const score = this.calculateScore(section);
                            return `
                                <div class="result-card">
                                    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px;">
                                        <span style="font-size: 14px; font-weight: 500; color: var(--fg-1);">${section}</span>
                                        <span style="font-size: 20px; font-weight: 700; color: ${this.getScoreColor(score)};">
                                            ${Math.round(score)}%
                                        </span>
                                    </div>
                                    <div class="progress">
                                        <div class="progress-bar" style="width: ${score}%; background: ${this.getScoreColor(score)};"></div>
                                    </div>
                                    <div style="font-size: 12px; color: var(--fg-3); margin-top: 6px; text-transform: uppercase; letter-spacing: 0.06em;">
                                        ${this.getScoreLabel(score)}
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <h3>Rekomendacje</h3>
                    ${allRecommendations.map(rec => `
                        <div class="recommendation-card ${rec.type}">
                            ${rec.text}
                        </div>
                    `).join('')}

                    <div class="button-group">
                        <button class="button secondary" onclick="survey.showResults = false; survey.showReview = true; survey.render()">
                            ← Przejrzyj odpowiedzi
                        </button>
                        <button class="button" onclick="survey.reset()">
                            Rozpocznij ponownie
                        </button>
                    </div>
                `;
            }

            renderSurvey() {
                const progress = this.calculateProgress();
                const currentQuestions = this.questions[this.currentSection];

                if (this.oneQuestionMode) {
                    const question = currentQuestions[this.currentQuestionIndex];
                    const allAnswered = currentQuestions.every(q => this.answers[q.id]);
                    const sections = Object.keys(this.questions);
                    const currentSectionIndex = sections.indexOf(this.currentSection);
                    const totalQuestions = this.getTotalQuestions();
                    const answeredQuestions = Object.keys(this.answers).length;

                    return `
                        ${this.renderSectionNavigator()}
                        <h2 class="title">${this.currentSection}</h2>
                        <div class="progress">
                            <div class="progress-bar" style="width: ${progress}%"></div>
                        </div>
                        <div style="text-align: right; font-size: 12px; color: var(--fg-3); margin-bottom: 16px; font-family: var(--font-mono);">
                            ${answeredQuestions}/${totalQuestions} pytań &nbsp;·&nbsp; ${Math.round(progress)}% ukończono
                        </div>

                        <div class="question">
                            <div class="question-header">
                                <span class="question-number">
                                    Pytanie ${this.currentQuestionIndex + 1} z ${currentQuestions.length}
                                </span>
                            </div>
                            <p style="font-size: 20px; font-weight: 500; line-height: 1.4; color: var(--fg-1); margin: 16px 0 24px;">
                                ${question.text}
                            </p>
                            <div>
                                ${question.options.map((option, idx) => `
                                    <button
                                        class="answer-btn ${this.answers[question.id] === question.scores[idx] ? 'selected' : ''}"
                                        onclick="survey.handleAnswer('${question.id}', ${question.scores[idx]}, ${JSON.stringify(question).replace(/"/g, '&quot;')}, ${idx})">
                                        <span style="font-family: var(--font-mono); font-size: 11px; opacity: 0.6; min-width: 20px;">${idx + 1}.</span>${option}
                                    </button>
                                `).join('')}
                            </div>
                        </div>

                        <div class="button-group">
                            ${currentSectionIndex === sections.length - 1 &&
                              this.currentQuestionIndex === currentQuestions.length - 1 && allAnswered ? `
                                <button
                                    class="button secondary"
                                    onclick="survey.showReview = true; survey.showWelcome = false; survey.render()">
                                    Przejrzyj odpowiedzi
                                </button>
                                <button
                                    class="button"
                                    onclick="survey.showResults = true; survey.showReview = false; survey.showWelcome = false; survey.render()">
                                    Zobacz wyniki →
                                </button>
                            ` : `
                                <button
                                    class="button secondary"
                                    onclick="survey.previousQuestion()"
                                    ${this.currentQuestionIndex === 0 && currentSectionIndex === 0 ? 'disabled' : ''}>
                                    ← Poprzednie
                                </button>
                                <button
                                    class="button"
                                    onclick="survey.nextQuestion()">
                                    Następne →
                                </button>
                            `}
                        </div>

                        <div class="help-text">
                            Nawigacja: strzałki klawiatury lub klawisze <span class="kbd">1</span>&ndash;<span class="kbd">5</span> do szybkiego wyboru
                        </div>
                    `;
                } else {
                    const allAnswered = currentQuestions.every(q => this.answers[q.id]);
                    const sections = Object.keys(this.questions);
                    const currentSectionIndex = sections.indexOf(this.currentSection);

                    return `
                        ${this.renderSectionNavigator()}
                        <h2 class="title">${this.currentSection}</h2>
                        <div class="progress">
                            <div class="progress-bar" style="width: ${progress}%"></div>
                        </div>
                        <div style="text-align: right; font-size: 12px; color: var(--fg-3); margin-bottom: 16px; font-family: var(--font-mono);">
                            ${Math.round(progress)}% ukończono
                        </div>
                        ${currentQuestions.map((q, idx) => `
                            <div class="question">
                                <div class="question-header">
                                    <span class="question-number">Pytanie ${idx + 1} z ${currentQuestions.length}</span>
                                </div>
                                <p style="font-size: 18px; font-weight: 500; line-height: 1.4; color: var(--fg-1); margin: 12px 0 20px;">
                                    ${q.text}
                                </p>
                                <div>
                                    ${q.options.map((option, optIdx) => `
                                        <button
                                            class="answer-btn ${this.answers[q.id] === q.scores[optIdx] ? 'selected' : ''}"
                                            onclick="survey.handleAnswer('${q.id}', ${q.scores[optIdx]}, ${JSON.stringify(q).replace(/"/g, '&quot;')}, ${optIdx})">
                                            <span style="font-family: var(--font-mono); font-size: 11px; opacity: 0.6; min-width: 20px;">${optIdx + 1}.</span>${option}
                                        </button>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                        <div class="button-group">
                            ${currentSectionIndex === sections.length - 1 && allAnswered ? `
                                <button
                                    class="button secondary"
                                    onclick="survey.showReview = true; survey.showWelcome = false; survey.render()">
                                    Przejrzyj odpowiedzi
                                </button>
                                <button
                                    class="button"
                                    onclick="survey.showResults = true; survey.showReview = false; survey.showWelcome = false; survey.render()">
                                    Zobacz wyniki →
                                </button>
                            ` : `
                                <button
                                    class="button secondary"
                                    onclick="survey.previousSection()"
                                    ${currentSectionIndex === 0 ? 'disabled' : ''}>
                                    ← Poprzednia sekcja
                                </button>
                                <button
                                    class="button"
                                    onclick="survey.nextSection()"
                                    ${!allAnswered ? 'disabled' : ''}>
                                    Następna sekcja →
                                </button>
                            `}
                        </div>
                    `;
                }
            }

            render() {
                if (this.showWelcome) {
                    this.app.innerHTML = this.renderWelcome();
                } else if (this.showReview) {
                    this.app.innerHTML = this.renderReview();
                } else if (this.showResults) {
                    this.app.innerHTML = this.renderResults();
                } else {
                    this.app.innerHTML = this.renderSurvey();
                }
            }
        }

        const survey = new Survey();
        survey.initialize();

        // Scroll progress indicator
        window.addEventListener('scroll', function() {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            const progressBar = document.getElementById('scrollProgress');
            if (progressBar) {
                progressBar.style.width = scrolled + '%';
            }
        });
    </script>
</body>
</html>
