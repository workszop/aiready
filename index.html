<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocena gotowości AI dla samorządów</title>
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap" />
    <style>
        /* ── Quantica Design Tokens ──────────────────────────────────────────── */
        :root {
            --quantica-pink:    #C41E54;
            --rose-pink:        #FF4D9A;
            --deep-berry:       #8A004C;
            --near-black:       #111111;
            --white:            #FFFFFF;

            --magenta-tint:     #FFE6F1;
            --cool-gray:        #E6E8EC;
            --light-gray:       #F5F6F8;
            --silver:           #D1D5DB;

            --violet-primary:   #7030A0;
            --violet-deep:      #4F1F75;
            --mist:             #F4EEFA;

            --amber:            #FFC107;

            --fg-1:             #111111;
            --fg-2:             #3A3A42;
            --fg-3:             #6B6B76;
            --fg-4:             #9A9AA5;
            --fg-on-pink:       #FFFFFF;
            --fg-brand:         #C41E54;

            --bg-1:             #FFFFFF;
            --bg-2:             #F5F6F8;

            --border-1:         #E6E8EC;
            --border-2:         #D1D5DB;
            --border-brand:     #C41E54;
            --border-focus:     #FF4D9A;

            --status-success:   #00A37A;
            --status-warning:   #FFC107;
            --status-error:     #DC2626;

            --grad-magenta:     linear-gradient(90deg, #C41E54 0%, #FF20A1 50%, #7030A0 100%);

            --font-sans:        "Satoshi", "Inter", system-ui, -apple-system, sans-serif;
            --font-mono:        "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;

            --fs-h1:            56px;
            --fs-h2:            28px;
            --fs-h3:            20px;
            --fs-body-lg:       18px;
            --fs-body:          14px;
            --fs-caption:       12px;

            --lh-h1:            1.1;
            --lh-h2:            1.25;
            --lh-h3:            1.4;
            --lh-body:          1.65;

            --tracking-h1:      -0.01em;
            --tracking-caps:    0.08em;

            --fw-regular:       400;
            --fw-medium:        500;
            --fw-bold:          700;

            --space-1:  4px;
            --space-2:  8px;
            --space-3:  12px;
            --space-4:  16px;
            --space-5:  24px;
            --space-6:  32px;
            --space-7:  40px;
            --space-8:  48px;
            --space-9:  64px;
            --space-10: 96px;

            --radius-xs:   4px;
            --radius-sm:   6px;
            --radius-md:   10px;
            --radius-lg:   16px;
            --radius-pill: 999px;

            --shadow-xs:        0 1px 2px rgba(17,17,17,0.04);
            --shadow-sm:        0 2px 6px rgba(17,17,17,0.06);
            --shadow-md:        0 8px 24px rgba(17,17,17,0.08);
            --shadow-pink-soft: 0 6px 18px rgba(196,30,84,0.10);
            --inner-hairline:   inset 0 0 0 1px rgba(17,17,17,0.06);

            --ease-standard:  cubic-bezier(0.2, 0.6, 0.2, 1);
            --ease-out-soft:  cubic-bezier(0.16, 1, 0.3, 1);
            --dur-1: 120ms;
            --dur-2: 200ms;
            --dur-3: 320ms;
        }

        /* ── Reset & base ────────────────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html {
            font-family: var(--font-sans);
            font-size: 16px;
            color: var(--fg-1);
            background: var(--bg-2);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: var(--space-8) var(--space-5);
        }

        /* ── Scroll progress ─────────────────────────────────────────────────── */
        .scroll-indicator {
            position: fixed; top: 0; left: 0; right: 0;
            height: 3px; background: var(--border-1); z-index: 9999;
        }
        .scroll-progress {
            height: 100%;
            background: var(--grad-magenta);
            width: 0%;
            transition: width 0.1s var(--ease-standard);
        }

        /* ── Card / page wrapper ─────────────────────────────────────────────── */
        .card {
            background: var(--bg-1);
            width: 100%;
            max-width: 760px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-1);
            overflow: hidden;
            position: relative;
        }

        /* Magenta accent bar at the top */
        .card::before {
            content: '';
            display: block;
            height: 3px;
            background: var(--grad-magenta);
        }

        #app {
            padding: var(--space-9) var(--space-7);
        }

        /* ── Typography ──────────────────────────────────────────────────────── */
        .title {
            font-family: var(--font-sans);
            font-size: 36px;
            line-height: 1.15;
            letter-spacing: var(--tracking-h1);
            font-weight: var(--fw-bold);
            color: var(--fg-1);
            margin-bottom: var(--space-4);
        }

        .subtitle {
            font-size: var(--fs-body-lg);
            line-height: var(--lh-body);
            color: var(--fg-2);
            margin-bottom: var(--space-6);
            max-width: 56ch;
        }

        .welcome-screen .subtitle { margin-left: auto; margin-right: auto; }

        h3 {
            font-size: var(--fs-caption);
            font-weight: var(--fw-medium);
            text-transform: uppercase;
            letter-spacing: var(--tracking-caps);
            color: var(--fg-brand);
            margin: var(--space-7) 0 var(--space-4);
        }

        /* ── Progress bar ────────────────────────────────────────────────────── */
        .progress {
            height: 4px;
            background: var(--border-1);
            border-radius: var(--radius-pill);
            margin: var(--space-4) 0;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: var(--grad-magenta);
            border-radius: var(--radius-pill);
            transition: width var(--dur-3) var(--ease-out-soft);
        }

        /* ── Question ────────────────────────────────────────────────────────── */
        .question {
            margin: var(--space-7) 0;
        }

        .question-header { margin-bottom: var(--space-3); }

        .question-number {
            font-size: var(--fs-caption);
            font-weight: var(--fw-medium);
            text-transform: uppercase;
            letter-spacing: var(--tracking-caps);
            color: var(--fg-brand);
        }

        /* ── Buttons — primary / secondary ───────────────────────────────────── */
        .button {
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
            padding: 10px 24px;
            border-radius: var(--radius-pill);
            font-family: var(--font-sans);
            font-size: var(--fs-body);
            font-weight: var(--fw-medium);
            cursor: pointer;
            border: 1.5px solid transparent;
            transition: background var(--dur-2) var(--ease-standard),
                        color var(--dur-2) var(--ease-standard),
                        border-color var(--dur-2) var(--ease-standard),
                        box-shadow var(--dur-2) var(--ease-standard),
                        transform var(--dur-1) var(--ease-standard);
            white-space: nowrap;
            text-decoration: none;
            background: var(--quantica-pink);
            color: var(--fg-on-pink);
            border-color: var(--quantica-pink);
            box-shadow: var(--shadow-pink-soft);
            width: 100%;
            margin: var(--space-2) 0;
            text-align: left;
            justify-content: flex-start;
        }

        .button:hover:not(:disabled) {
            background: var(--deep-berry);
            border-color: var(--deep-berry);
        }

        .button:focus-visible {
            outline: 2px solid var(--border-focus);
            outline-offset: 2px;
        }

        .button.selected {
            background: var(--deep-berry);
            border-color: var(--deep-berry);
        }

        .button.selected::after {
            content: '✓';
            margin-left: auto;
            font-weight: var(--fw-bold);
        }

        .button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            box-shadow: none;
        }

        .button.secondary {
            background: transparent;
            color: var(--quantica-pink);
            border-color: var(--quantica-pink);
            box-shadow: none;
        }

        .button.secondary:hover:not(:disabled) {
            background: var(--magenta-tint);
        }

        /* Answer option buttons — outlined default, filled when selected */
        .answer-btn {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            width: 100%;
            margin: var(--space-2) 0;
            padding: var(--space-4) var(--space-5);
            border-radius: var(--radius-md);
            font-family: var(--font-sans);
            font-size: var(--fs-body-lg);
            font-weight: var(--fw-regular);
            cursor: pointer;
            border: 1.5px solid var(--border-1);
            background: var(--bg-1);
            color: var(--fg-2);
            text-align: left;
            transition: all var(--dur-2) var(--ease-standard);
        }

        .answer-btn:hover:not(:disabled) {
            border-color: var(--border-brand);
            background: var(--magenta-tint);
            color: var(--fg-1);
            transform: translateX(4px);
        }

        .answer-btn.selected {
            background: var(--quantica-pink);
            color: var(--fg-on-pink);
            border-color: var(--quantica-pink);
            box-shadow: var(--shadow-pink-soft);
        }

        .answer-btn.selected::after {
            content: '✓';
            margin-left: auto;
            font-weight: var(--fw-bold);
        }

        .answer-btn.selected:hover {
            background: var(--deep-berry);
            border-color: var(--deep-berry);
            transform: none;
        }

        .answer-btn:focus-visible {
            outline: 2px solid var(--border-focus);
            outline-offset: 2px;
        }

        /* Nav button group */
        .button-group {
            display: flex;
            gap: var(--space-3);
            margin-top: var(--space-7);
        }

        .button-group .button {
            flex: 1;
            text-align: center;
            justify-content: center;
            margin: 0;
        }

        /* ── Welcome screen ──────────────────────────────────────────────────── */
        .welcome-screen { text-align: center; }

        .feature-list {
            text-align: left;
            margin: var(--space-6) auto;
            max-width: 460px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: var(--space-4);
            padding: var(--space-3) 0;
            border-bottom: 1px solid var(--border-1);
            font-size: var(--fs-body-lg);
            color: var(--fg-2);
        }

        .feature-item:last-child { border-bottom: none; }

        .feature-icon {
            width: 28px; height: 28px;
            background: var(--magenta-tint);
            color: var(--fg-brand);
            border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: var(--fw-bold); flex-shrink: 0;
        }

        /* ── Results grid ────────────────────────────────────────────────────── */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: var(--space-3);
            margin: var(--space-5) 0;
        }

        .result-card {
            padding: var(--space-5);
            background: var(--bg-2);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-1);
            transition: box-shadow var(--dur-2) var(--ease-standard);
        }

        .result-card:hover {
            box-shadow: var(--shadow-sm);
        }

        /* ── Score display ───────────────────────────────────────────────────── */
        .score {
            font-family: var(--font-sans);
            font-size: 80px;
            font-weight: var(--fw-bold);
            line-height: 1;
            letter-spacing: -0.03em;
            text-align: center;
            color: var(--quantica-pink);
            margin: var(--space-5) 0 var(--space-3);
        }

        /* ── Review ──────────────────────────────────────────────────────────── */
        .review-section {
            margin: var(--space-5) 0;
            padding: var(--space-5);
            background: var(--bg-2);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-1);
        }

        .review-question {
            padding: var(--space-3) 0;
            border-bottom: 1px solid var(--border-1);
            font-size: var(--fs-body-lg);
            color: var(--fg-2);
        }

        .review-question:last-child { border-bottom: none; }

        .review-answer {
            color: var(--fg-brand);
            font-weight: var(--fw-medium);
            margin-top: var(--space-1);
        }

        /* ── Radar chart ─────────────────────────────────────────────────────── */
        .radar-wrap {
            display: flex;
            justify-content: center;
            margin: var(--space-6) 0 var(--space-7);
        }

        .radar-wrap svg {
            overflow: visible;
        }

        /* ── Action cards ────────────────────────────────────────────────────── */
        .action-card {
            display: flex;
            gap: var(--space-5);
            align-items: flex-start;
            padding: var(--space-5);
            background: var(--bg-2);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-1);
            border-left: 3px solid var(--quantica-pink);
            margin: var(--space-3) 0;
        }

        .action-num {
            font-family: var(--font-mono);
            font-size: var(--fs-caption);
            font-weight: 600;
            color: var(--fg-brand);
            min-width: var(--space-5);
            padding-top: 2px;
            flex-shrink: 0;
        }

        .action-body { flex: 1; }

        .action-eyebrow {
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: var(--tracking-caps);
            color: var(--fg-brand);
            margin-bottom: var(--space-1);
        }

        .action-text {
            font-size: var(--fs-body-lg);
            line-height: var(--lh-body);
            color: var(--fg-1);
        }

        /* ── Download buttons ────────────────────────────────────────────────── */
        .download-buttons {
            display: flex;
            gap: var(--space-3);
            margin: var(--space-5) 0;
            justify-content: center;
        }

        .download-buttons .button {
            width: auto;
            flex: 0 1 auto;
            min-width: 120px;
            justify-content: center;
        }

        .icon-button { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); }

        /* ── Animations ──────────────────────────────────────────────────────── */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        #app { animation: fadeIn var(--dur-3) var(--ease-out-soft); }

        .question { animation: fadeIn var(--dur-2) var(--ease-standard); }

        /* ── Top bar ─────────────────────────────────────────────────────────── */
        .topbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 200;
            height: 56px;
            display: flex;
            align-items: center;
            gap: var(--space-5);
            padding: 0 var(--space-6);
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-1);
        }

        .topbar__logo img {
            display: block;
            height: 24px;
            width: auto;
        }

        .topbar__nav {
            flex: 1;
            display: flex;
            gap: var(--space-1);
            overflow-x: auto;
            scrollbar-width: none;
        }
        .topbar__nav::-webkit-scrollbar { display: none; }

        .topbar__step {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            padding: 4px 10px;
            border-radius: var(--radius-pill);
            font-size: 11px;
            font-weight: var(--fw-medium);
            white-space: nowrap;
            cursor: pointer;
            border: 1px solid transparent;
            color: var(--fg-3);
            background: transparent;
            transition: all var(--dur-1) var(--ease-standard);
        }

        .topbar__step:hover { color: var(--fg-1); background: var(--bg-2); }

        .topbar__step.current {
            background: var(--magenta-tint);
            color: var(--fg-brand);
            border-color: var(--border-brand);
        }

        .topbar__step.done {
            color: var(--violet-primary);
        }

        .topbar__step-num {
            font-family: var(--font-mono);
            font-size: 10px;
            opacity: 0.7;
        }

        /* Push body down so content isn't hidden behind topbar */
        body { padding-top: calc(var(--space-8) + 56px); }

        /* ── Print — results as a clean PDF report ──────────────────────────── */
        /* Print-only Quantica logo header; hidden on screen */
        .print-logo { display: none; }

        /* margin: 0 suppresses Chrome's auto URL/date/page-number annotations;
           per-page spacing comes from element padding in mm instead */
        @page {
            size: A4 portrait;
            margin: 0;
        }

        @media print {
            body { padding: 0; background: white; }
            .topbar,
            .scroll-indicator,
            .download-buttons,
            .button-group { display: none !important; }
            .card {
                max-width: 100%;
                border: none;
                box-shadow: none;
                border-radius: 0;
            }
            .card::before { display: none; }
            .print-logo {
                display: block;
                padding: 14mm 18mm 0;
            }
            .print-logo img {
                display: block;
                height: 7mm;
                width: auto;
            }
            #app { padding: 8mm 18mm 16mm; animation: none; }
            html, body {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .result-card, .action-card { break-inside: avoid; }
            .radar-wrap { break-inside: avoid; }
        }

        /* ── Responsive ──────────────────────────────────────────────────────── */
        @media (max-width: 600px) {
            body { padding: calc(56px + var(--space-4)) 0 var(--space-4); }
            .card { border-radius: 0; border-left: none; border-right: none; }
            #app { padding: var(--space-6) var(--space-5); }
            .title { font-size: 2rem; }
            .button-group { flex-direction: column; }
            .results-grid { grid-template-columns: 1fr; }
            .score { font-size: 56px; }
            .topbar { padding: 0 var(--space-4); gap: var(--space-3); }
            .topbar__step-label { display: none; }
        }
    </style>
</head>
<body>
    <!-- Top bar -->
    <header class="topbar" id="topbar">
        <a class="topbar__logo" href="#" aria-label="Quantica Lab">
            <img src="https://workszop.github.io/md2web/assets/quantica-logo-color.png" alt="Quantica Lab" />
        </a>
        <nav class="topbar__nav" id="topbar-nav" aria-label="Sekcje ankiety"></nav>
    </header>

    <!-- Scroll Progress Indicator -->
    <div class="scroll-indicator">
        <div class="scroll-progress" id="scrollProgress"></div>
    </div>

    <div class="card">
        <div class="print-logo" aria-hidden="true">
            <img src="https://workszop.github.io/md2web/assets/quantica-logo-color.png" alt="" />
        </div>
        <div id="app"></div>
    </div>

    <script>
        class Survey {
            constructor() {
                this.app = document.getElementById('app');
                this.questions = {};
                this.currentSection = '';
                this.answers = {};
                this.answerDetails = {}; // Store question text and selected option text
                this.showResults = false;
                this.showWelcome = true;
                this.showReview = false;
                this.currentQuestionIndex = 0;
                this.oneQuestionMode = true;
                this.hasSavedData = false;
                this.checkForSavedData();
            }

            checkForSavedData() {
                try {
                    const savedAnswers = localStorage.getItem('aiready_v2_answers');
                    if (savedAnswers) {
                        const parsed = JSON.parse(savedAnswers);
                        this.hasSavedData = Object.keys(parsed).length > 0;
                        if (this.hasSavedData) {
                            this.answers = parsed;
                            const savedDetails = localStorage.getItem('aiready_v2_details');
                            if (savedDetails) {
                                this.answerDetails = JSON.parse(savedDetails);
                            }
                        }
                    }
                } catch (e) {
                    console.error('Error loading saved data:', e);
                    this.hasSavedData = false;
                }
            }

            loadFromLocalStorage() {
                const savedAnswers = localStorage.getItem('aiready_v2_answers');
                const savedDetails = localStorage.getItem('aiready_v2_details');
                const savedSection = localStorage.getItem('aiready_v2_section');
                const savedIndex = localStorage.getItem('aiready_v2_index');

                if (savedAnswers) this.answers = JSON.parse(savedAnswers);
                if (savedDetails) this.answerDetails = JSON.parse(savedDetails);
                if (savedSection) this.currentSection = savedSection;
                if (savedIndex) this.currentQuestionIndex = parseInt(savedIndex);

                this.showWelcome = false;
            }

            async initialize() {
                try {
                    const response = await fetch('questions.txt');
                    const text = await response.text();
                    this.questions = this.parseQuestions(text);
                    if (!this.currentSection) {
                        this.currentSection = Object.keys(this.questions)[0];
                    }
                    this.setupKeyboardNavigation();
                    this.render();
                } catch (error) {
                    console.error('Error loading questions:', error);
                }
            }

            parseQuestions(text) {
                const sections = {};
                let currentSection = '';

                text.split('\n').forEach(line => {
                    if (line.startsWith('#')) {
                        currentSection = line.substring(1).trim();
                        sections[currentSection] = [];
                    } else if (line.trim() && currentSection) {
                        const [question, ...options] = line.split('|');
                        if (question && options.length) {
                            sections[currentSection].push({
                                id: `${currentSection}-${sections[currentSection].length + 1}`,
                                text: question.trim(),
                                options: options.map(o => o.trim()),
                                // Last option scores 0 so the worst possible answer maps to 0%
                                scores: options.map((_, i) => options.length - 1 - i)
                            });
                        }
                    }
                });

                return sections;
            }

            setupKeyboardNavigation() {
                document.addEventListener('keydown', (e) => {
                    if (this.showWelcome || this.showResults) return;

                    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                        e.preventDefault();
                        this.nextQuestion();
                    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                        e.preventDefault();
                        this.previousQuestion();
                    } else if (e.key >= '1' && e.key <= '5') {
                        e.preventDefault();
                        this.selectAnswerByNumber(parseInt(e.key) - 1);
                    }
                });
            }

            selectAnswerByNumber(index) {
                if (!this.oneQuestionMode) return;

                const currentQuestions = this.questions[this.currentSection];
                const question = currentQuestions[this.currentQuestionIndex];
                if (question && question.options[index]) {
                    this.handleAnswer(question.id, question.scores[index], question, index);
                }
            }

            nextQuestion() {
                if (!this.oneQuestionMode) return;

                const currentQuestions = this.questions[this.currentSection];
                if (this.currentQuestionIndex < currentQuestions.length - 1) {
                    this.currentQuestionIndex++;
                    this.render();
                } else {
                    this.nextSection();
                }
            }

            previousQuestion() {
                if (!this.oneQuestionMode) return;

                if (this.currentQuestionIndex > 0) {
                    this.currentQuestionIndex--;
                    this.render();
                } else {
                    this.previousSection();
                }
            }

            previousSection() {
                const sections = Object.keys(this.questions);
                const currentIndex = sections.indexOf(this.currentSection);

                if (currentIndex > 0) {
                    this.currentSection = sections[currentIndex - 1];
                    const prevSectionQuestions = this.questions[this.currentSection];
                    this.currentQuestionIndex = prevSectionQuestions.length - 1;
                    this.render();
                }
            }

            saveToLocalStorage() {
                localStorage.setItem('aiready_v2_answers', JSON.stringify(this.answers));
                localStorage.setItem('aiready_v2_details', JSON.stringify(this.answerDetails));
                localStorage.setItem('aiready_v2_section', this.currentSection);
                localStorage.setItem('aiready_v2_index', this.currentQuestionIndex.toString());
            }

            clearLocalStorage() {
                localStorage.removeItem('aiready_v2_answers');
                localStorage.removeItem('aiready_v2_details');
                localStorage.removeItem('aiready_v2_section');
                localStorage.removeItem('aiready_v2_index');
            }

            getScoreColor(score) {
                if (score >= 80) return '#00A37A';
                if (score >= 60) return '#7030A0';
                if (score >= 40) return '#C41E54';
                if (score >= 20) return '#FFC107';
                return '#DC2626';
            }

            calculateScore(section) {
                const sectionData = this.questions[section];
                const answered = sectionData.filter(q => this.answers[q.id] !== undefined);

                if (answered.length === 0) return 0;

                // Average per-question fractions so 3- and 4-option questions weigh equally
                const sum = answered.reduce((acc, q) => acc + (this.answers[q.id] / q.scores[0]), 0);
                return (sum / answered.length) * 100;
            }

            calculateProgress() {
                const totalQuestions = Object.values(this.questions)
                    .reduce((sum, section) => sum + section.length, 0);
                const answeredQuestions = Object.keys(this.answers).length;
                return (answeredQuestions / totalQuestions) * 100;
            }

            getTotalQuestions() {
                return Object.values(this.questions)
                    .reduce((sum, section) => sum + section.length, 0);
            }

            isSectionCompleted(section) {
                const sectionData = this.questions[section];
                return sectionData.every(q => this.answers[q.id] !== undefined);
            }

            goToSection(section) {
                this.currentSection = section;
                this.currentQuestionIndex = 0;
                this.render();
            }

            handleAnswer(id, score, question, optionIndex) {
                this.answers[id] = score;
                this.answerDetails[id] = {
                    question: question.text,
                    answer: question.options[optionIndex],
                    score: score,
                    section: this.currentSection
                };
                this.saveToLocalStorage();

                if (this.oneQuestionMode) {
                    this.nextQuestion();
                } else {
                    this.render();
                }
            }

            nextSection() {
                const sections = Object.keys(this.questions);
                const currentIndex = sections.indexOf(this.currentSection);

                if (currentIndex < sections.length - 1) {
                    this.currentSection = sections[currentIndex + 1];
                    this.currentQuestionIndex = 0;
                } else {
                    this.showReview = true;
                }
                this.render();
            }

            continueSurvey() {
                this.loadFromLocalStorage();
                this.render();
            }

            startFresh() {
                this.clearLocalStorage();
                this.answers = {};
                this.answerDetails = {};
                this.hasSavedData = false;
                this.render();
            }

            startSurvey() {
                this.showWelcome = false;
                this.oneQuestionMode = true;
                this.render();
            }

            reset() {
                this.answers = {};
                this.answerDetails = {};
                this.showResults = false;
                this.showWelcome = true;
                this.showReview = false;
                this.currentSection = Object.keys(this.questions)[0];
                this.currentQuestionIndex = 0;
                this.hasSavedData = false;
                this.clearLocalStorage();
                this.render();
            }

            downloadJSON() {
                const data = {
                    timestamp: new Date().toISOString(),
                    answers: this.answerDetails,
                    scores: {}
                };

                Object.keys(this.questions).forEach(section => {
                    data.scores[section] = this.calculateScore(section);
                });

                const overallScore = Object.values(data.scores).reduce((a, b) => a + b, 0) / Object.keys(data.scores).length;
                data.overallScore = overallScore;

                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `ai-readiness-${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                URL.revokeObjectURL(url);
            }

            downloadCSV() {
                let csv = 'Sekcja,Pytanie,Odpowiedź,Wynik\n';

                Object.values(this.answerDetails).forEach(detail => {
                    csv += `"${detail.section}","${detail.question}","${detail.answer}",${detail.score}\n`;
                });

                csv += '\n\nPodsumowanie wyników\n';
                csv += 'Sekcja,Wynik %\n';
                Object.keys(this.questions).forEach(section => {
                    const score = this.calculateScore(section);
                    csv += `"${section}",${Math.round(score)}\n`;
                });

                const overallScore = Object.keys(this.questions)
                    .reduce((sum, sec) => sum + this.calculateScore(sec), 0) / Object.keys(this.questions).length;
                csv += `\n"Wynik ogólny",${Math.round(overallScore)}\n`;

                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `ai-readiness-${new Date().toISOString().split('T')[0]}.csv`;
                a.click();
                URL.revokeObjectURL(url);
            }

            renderWelcome() {
                const totalQuestions = this.getTotalQuestions();
                const estimatedTime = Math.ceil(totalQuestions * 0.5);

                if (this.hasSavedData) {
                    const savedAnswersCount = Object.keys(this.answers).length;
                    return `
                        <div class="welcome-screen">
                            <div style="font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-brand); margin-bottom: 16px;">Ocena gotowości</div>
                            <h1 class="title">Twoja ankieta czeka</h1>
                            <p class="subtitle">
                                Znaleziono zapisaną ankietę z ${savedAnswersCount} odpowiedziami.
                                Czy chcesz kontynuować czy zacząć od nowa?
                            </p>

                            <div class="button-group" style="justify-content: center; max-width: 480px; margin: 0 auto;">
                                <button class="button" style="width: auto; flex: 1;" onclick="survey.continueSurvey()">
                                    Kontynuuj ankietę
                                </button>
                                <button class="button secondary" style="width: auto; flex: 1;" onclick="survey.startFresh()">
                                    Zacznij od nowa
                                </button>
                            </div>
                        </div>
                    `;
                }

                return `
                    <div class="welcome-screen">
                        <div style="font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-brand); margin-bottom: 16px;">AI w samorządzie</div>
                        <h1 class="title">Ocena gotowości AI</h1>
                        <p class="subtitle">
                            Narzędzie do oceny gotowości miasta na wdrożenie sztucznej inteligencji.
                            Zidentyfikuj mocne strony i obszary wymagające uwagi.
                        </p>

                        <div class="feature-list">
                            <div class="feature-item">
                                <div class="feature-icon">→</div>
                                <div>${totalQuestions} pytań w ${Object.keys(this.questions).length} kategoriach</div>
                            </div>
                            <div class="feature-item">
                                <div class="feature-icon">~</div>
                                <div>Szacowany czas: ~${estimatedTime} minut</div>
                            </div>
                            <div class="feature-item">
                                <div class="feature-icon">↓</div>
                                <div>Automatyczny zapis postępu</div>
                            </div>
                            <div class="feature-item">
                                <div class="feature-icon">%</div>
                                <div>Szczegółowy raport z rekomendacjami</div>
                            </div>
                            <div class="feature-item">
                                <div class="feature-icon">↗</div>
                                <div>Eksport wyników (PDF, CSV, JSON)</div>
                            </div>
                        </div>

                        <div class="button-group" style="justify-content: center; max-width: 360px; margin: 0 auto;">
                            <button class="button" style="width: auto; flex: 1;" onclick="survey.startSurvey()">
                                Rozpocznij ocenę →
                            </button>
                        </div>
                    </div>
                `;
            }

            renderReview() {
                const sections = Object.keys(this.questions);

                return `
                    <div style="font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-brand); margin-bottom: 16px;">Przegląd</div>
                    <h2 class="title">Twoje odpowiedzi</h2>
                    <p class="subtitle">Sprawdź swoje odpowiedzi przed wyświetleniem wyników.</p>

                    ${sections.map(section => {
                        const sectionQuestions = this.questions[section];
                        return `
                            <div class="review-section">
                                <h3 style="margin-top: 0; margin-bottom: 8px;">${section}</h3>
                                ${sectionQuestions.map(q => {
                                    const detail = this.answerDetails[q.id];
                                    return detail ? `
                                        <div class="review-question">
                                            <div style="font-weight: 500; color: var(--fg-1);">${detail.question}</div>
                                            <div class="review-answer">→ ${detail.answer}</div>
                                        </div>
                                    ` : '';
                                }).join('')}
                            </div>
                        `;
                    }).join('')}

                    <div class="button-group">
                        <button class="button secondary" onclick="survey.showReview = false; survey.render()">
                            ← Wróć do ankiety
                        </button>
                        <button class="button" onclick="survey.showResults = true; survey.showReview = false; survey.render()">
                            Pokaż wyniki →
                        </button>
                    </div>
                `;
            }

            renderResults() {
                const SECTION_KEY = {
                    'Strategia i przywództwo': 'strategia',
                    'Dane i prywatność': 'dane',
                    'Infrastruktura technologiczna': 'infra',
                    'Usługi miejskie i przypadki użycia': 'uslugi',
                    'Zespół i partnerstwa': 'zespol',
                    'Etyka i zaufanie mieszkańców': 'etyka'
                };

                const ACTIONS = {
                    strategia: {
                        1: "Powołaj zespół roboczy ds. AI i wyznacz lidera cyfryzacji odpowiedzialnego za koordynację działań.",
                        2: "Opracuj formalny dokument strategii AI i przedstaw go władzom miasta do akceptacji.",
                        3: "Włącz strategię AI do wieloletniego planu finansowego i powiąż z mierzalnymi wskaźnikami KPI.",
                        4: "Dołącz do krajowej lub unijnej sieci smart city i aktywnie dziel się doświadczeniami.",
                        5: "Opublikuj otwarte sprawozdanie z realizacji strategii AI i buduj pozycję miasta jako punktu referencyjnego."
                    },
                    dane: {
                        1: "Przeprowadź audyt dostępnych danych miejskich i zidentyfikuj kluczowe luki w jakości i dostępności.",
                        2: "Opracuj politykę zarządzania danymi i wdróż procedury ochrony danych zgodne z RODO.",
                        3: "Stwórz centralny katalog danych miejskich i uruchom platformę wymiany danych między wydziałami.",
                        4: "Wdróż mechanizmy zarządzania jakością danych i przygotuj zbiory do zasilania systemów AI.",
                        5: "Otwórz wybrane zbiory jako open data i nawiąż współpracę z uczelniami w zakresie ich analizy."
                    },
                    infra: {
                        1: "Przeprowadź inwentaryzację infrastruktury IT i oceń jej zdolność do obsługi rozwiązań AI.",
                        2: "Określ strategię utrzymania infrastruktury dla nowych rozwiązań (lokalnie, w chmurze lub hybrydowo).",
                        3: "Uruchom środowisko testowe do bezpiecznego pilotowania rozwiązań AI.",
                        4: "Wdróż monitoring wydajności i kosztów infrastruktury wraz z planem skalowania.",
                        5: "Optymalizuj infrastrukturę pod kątem kosztów i zużycia energii oraz dziel się dobrymi praktykami z innymi samorządami."
                    },
                    uslugi: {
                        1: "Zidentyfikuj 2–3 usługi o największym potencjale automatyzacji i opracuj wstępne analizy możliwości.",
                        2: "Uruchom pierwszy projekt pilotażowy AI z mierzalnymi celami i dedykowanym budżetem.",
                        3: "Opracuj mapę drogową wdrożeń AI dla kolejnych usług i określ priorytety na podstawie analizy wartości.",
                        4: "Wdróż monitoring efektywności systemów AI i prowadź regularne przeglądy wyników z interesariuszami.",
                        5: "Standaryzuj procesy wdrożeń i udostępnij wypracowane rozwiązania innym miastom."
                    },
                    zespol: {
                        1: "Wyznacz osobę odpowiedzialną za projekty cyfrowe i zapewnij jej podstawowe szkolenie z zakresu AI.",
                        2: "Opracuj plan rozwoju kompetencji AI dla pracowników i nawiąż kontakt z lokalną uczelnią lub hubem technologicznym.",
                        3: "Sformalizuj partnerstwa z dostawcami AI i określ kryteria oceny technologii w zamówieniach publicznych.",
                        4: "Zbuduj interdyscyplinarny zespół ds. innowacji łączący IT, prawo i kompetencje merytoryczne wydziałów.",
                        5: "Ustanów miejskie centrum kompetencji AI i uczestnicz aktywnie w europejskich sieciach wymiany wiedzy."
                    },
                    etyka: {
                        1: "Zinwentaryzuj systemy AI stosowane w mieście i oceń ich wpływ na prawa mieszkańców.",
                        2: "Opracuj politykę przejrzystości AI i poinformuj mieszkańców o sposobach wykorzystania ich danych.",
                        3: "Wdróż procedury audytu algorytmicznego dla systemów podejmujących decyzje dotyczące mieszkańców.",
                        4: "Sklasyfikuj systemy AI zgodnie z unijnym Aktem o AI i dostosuj procesy do wymogów wysokiego ryzyka.",
                        5: "Powołaj radę ds. etyki AI z udziałem mieszkańców jako stały organ doradczy miasta."
                    }
                };

                const getLevel = (score) => {
                    if (score <= 20) return 1;
                    if (score <= 40) return 2;
                    if (score <= 60) return 3;
                    if (score <= 80) return 4;
                    return 5;
                };

                const renderRadar = (categoryScores) => {
                    const cx = 160, cy = 160, maxR = 110;
                    const sectionNames = Object.keys(categoryScores);
                    const n = sectionNames.length;
                    const angles = sectionNames.map((_, i) =>
                        (i * 2 * Math.PI / n) - Math.PI / 2
                    );

                    const SHORT_LABELS = {
                        'Strategia i przywództwo': 'Strategia',
                        'Dane i prywatność': 'Dane',
                        'Infrastruktura technologiczna': 'Infrastruktura',
                        'Usługi miejskie i przypadki użycia': 'Usługi',
                        'Zespół i partnerstwa': 'Zespół',
                        'Etyka i zaufanie mieszkańców': 'Etyka'
                    };

                    const gridLines = [0.33, 0.66, 1.0].map(factor => {
                        const r = factor * maxR;
                        const pts = angles
                            .map(a => `${(cx + r * Math.cos(a)).toFixed(1)},${(cy + r * Math.sin(a)).toFixed(1)}`)
                            .join(' ');
                        return `<polygon points="${pts}" fill="none" stroke="#E6E8EC" stroke-width="1"/>`;
                    }).join('');

                    const axisLines = angles.map(a =>
                        `<line x1="${cx}" y1="${cy}" x2="${(cx + maxR * Math.cos(a)).toFixed(1)}" y2="${(cy + maxR * Math.sin(a)).toFixed(1)}" stroke="#E6E8EC" stroke-width="1"/>`
                    ).join('');

                    const scorePoints = sectionNames.map((s, i) => {
                        const r = (categoryScores[s] / 100) * maxR;
                        return `${(cx + r * Math.cos(angles[i])).toFixed(1)},${(cy + r * Math.sin(angles[i])).toFixed(1)}`;
                    }).join(' ');

                    const labelR = maxR + 20;
                    const axisLabels = sectionNames.map((s, i) => {
                        const x = cx + labelR * Math.cos(angles[i]);
                        const y = cy + labelR * Math.sin(angles[i]);
                        const cosA = Math.cos(angles[i]);
                        const anchor = cosA > 0.1 ? 'start' : cosA < -0.1 ? 'end' : 'middle';
                        const label = SHORT_LABELS[s] || s.split(' ')[0];
                        return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anchor}" dominant-baseline="middle" font-family="Satoshi,Inter,sans-serif" font-size="11" fill="#6B6B76">${label}</text>`;
                    }).join('');

                    const overall = Math.round(
                        Object.values(categoryScores).reduce((a, b) => a + b, 0) / n
                    );

                    return `
                        <div class="radar-wrap">
                            <svg viewBox="0 0 320 320" width="320" height="320" aria-hidden="true">
                                ${gridLines}
                                ${axisLines}
                                <polygon points="${scorePoints}" fill="rgba(196,30,84,0.2)" stroke="#C41E54" stroke-width="2" stroke-linejoin="round"/>
                                ${axisLabels}
                                <text x="160" y="152" text-anchor="middle" font-family="Satoshi,Inter,sans-serif" font-size="28" font-weight="700" fill="#111111">${overall}%</text>
                                <text x="160" y="172" text-anchor="middle" font-family="Geist Mono,monospace" font-size="11" fill="#6B6B76">wynik ogólny</text>
                            </svg>
                        </div>
                    `;
                };

                const sections = Object.keys(this.questions);

                // Build category scores map (preserving section order)
                const categoryScores = {};
                sections.forEach(s => { categoryScores[s] = this.calculateScore(s); });

                // Top-3 worst categories for action list
                const sorted = [...sections].sort((a, b) => categoryScores[a] - categoryScores[b]);
                const top3 = sorted.slice(0, 3);

                return `
                    <div style="font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--fg-brand);margin-bottom:var(--space-3);">Wyniki oceny</div>
                    <h1 class="title">Ocena gotowości AI<br>dla samorządów</h1>

                    ${renderRadar(categoryScores)}

                    <h3>Wyniki szczegółowe</h3>
                    <div class="results-grid">
                        ${sections.map(section => {
                            const score = categoryScores[section];
                            const level = getLevel(score);
                            return `
                                <div class="result-card">
                                    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:var(--space-2);">
                                        <span style="font-size:var(--fs-body);font-weight:500;color:var(--fg-1);">${section}</span>
                                        <span style="font-size:18px;font-weight:700;color:${this.getScoreColor(score)};">${Math.round(score)}%</span>
                                    </div>
                                    <div class="progress">
                                        <div class="progress-bar" style="width:${score}%;background:${this.getScoreColor(score)};"></div>
                                    </div>
                                    <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3);margin-top:var(--space-2);">Poziom ${level}</div>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <h3>3 priorytety działań</h3>
                    ${top3.map((section, i) => {
                        const score = categoryScores[section];
                        const level = getLevel(score);
                        const key = SECTION_KEY[section] || 'strategia';
                        const action = ACTIONS[key][level];
                        const num = String(i + 1).padStart(2, '0');
                        return `
                            <div class="action-card">
                                <div class="action-num">${num}</div>
                                <div class="action-body">
                                    <div class="action-eyebrow">${section}</div>
                                    <div class="action-text">${action}</div>
                                </div>
                            </div>
                        `;
                    }).join('')}

                    <div class="download-buttons" style="margin-top:var(--space-7);">
                        <button class="button icon-button" onclick="window.print()">Drukuj / PDF</button>
                        <button class="button secondary icon-button" onclick="survey.downloadCSV()">CSV</button>
                        <button class="button secondary icon-button" onclick="survey.downloadJSON()">JSON</button>
                    </div>
                    <div class="button-group" style="margin-top:var(--space-4);">
                        <button class="button secondary" onclick="survey.showResults=false;survey.showReview=true;survey.render()">← Przejrzyj odpowiedzi</button>
                        <button class="button" onclick="survey.reset()">Rozpocznij ponownie</button>
                    </div>
                `;
            }

            renderSurvey() {
                const progress = this.calculateProgress();
                const currentQuestions = this.questions[this.currentSection];
                const question = currentQuestions[this.currentQuestionIndex];
                // Answers can score 0, so check for presence, not truthiness
                const allAnswered = currentQuestions.every(q => this.answers[q.id] !== undefined);
                const sections = Object.keys(this.questions);
                const currentSectionIndex = sections.indexOf(this.currentSection);
                const totalQuestions = this.getTotalQuestions();
                const answeredQuestions = Object.keys(this.answers).length;

                return `
                        <h2 class="title">${this.currentSection}</h2>
                        <div class="progress">
                            <div class="progress-bar" style="width: ${progress}%"></div>
                        </div>
                        <div style="text-align: right; font-size: 12px; color: var(--fg-3); margin-bottom: 16px; font-family: var(--font-mono);">
                            ${answeredQuestions}/${totalQuestions} pytań &nbsp;·&nbsp; ${Math.round(progress)}% ukończono
                        </div>

                        <div class="question">
                            <div class="question-header">
                                <span class="question-number">
                                    Pytanie ${this.currentQuestionIndex + 1} z ${currentQuestions.length}
                                </span>
                            </div>
                            <p style="font-size: 20px; font-weight: 500; line-height: 1.4; color: var(--fg-1); margin: 16px 0 24px;">
                                ${question.text}
                            </p>
                            <div>
                                ${question.options.map((option, idx) => `
                                    <button
                                        class="answer-btn ${this.answers[question.id] === question.scores[idx] ? 'selected' : ''}"
                                        onclick="survey.handleAnswer('${question.id}', ${question.scores[idx]}, ${JSON.stringify(question).replace(/"/g, '&quot;')}, ${idx})">
                                        <span style="font-family: var(--font-mono); font-size: 11px; opacity: 0.6; min-width: 20px;">${idx + 1}.</span>${option}
                                    </button>
                                `).join('')}
                            </div>
                        </div>

                        <div class="button-group">
                            ${currentSectionIndex === sections.length - 1 &&
                              this.currentQuestionIndex === currentQuestions.length - 1 && allAnswered ? `
                                <button
                                    class="button secondary"
                                    onclick="survey.showReview = true; survey.showWelcome = false; survey.render()">
                                    Przejrzyj odpowiedzi
                                </button>
                                <button
                                    class="button"
                                    onclick="survey.showResults = true; survey.showReview = false; survey.showWelcome = false; survey.render()">
                                    Zobacz wyniki →
                                </button>
                            ` : `
                                <button
                                    class="button secondary"
                                    onclick="survey.previousQuestion()"
                                    ${this.currentQuestionIndex === 0 && currentSectionIndex === 0 ? 'disabled' : ''}>
                                    ← Poprzednie
                                </button>
                                <button
                                    class="button"
                                    onclick="survey.nextQuestion()">
                                    Następne →
                                </button>
                            `}
                        </div>
                    `;
            }

            render() {
                if (this.showWelcome) {
                    this.app.innerHTML = this.renderWelcome();
                } else if (this.showReview) {
                    this.app.innerHTML = this.renderReview();
                } else if (this.showResults) {
                    this.app.innerHTML = this.renderResults();
                } else {
                    this.app.innerHTML = this.renderSurvey();
                }
                this.renderTopbarNav();
            }

            renderTopbarNav() {
                const nav = document.getElementById('topbar-nav');
                if (!nav) return;

                // Only show section steps during survey (not welcome/results/review)
                if (this.showWelcome || this.showResults || this.showReview || this.showStatusView) {
                    nav.innerHTML = '';
                    return;
                }

                const sections = Object.keys(this.questions);
                nav.innerHTML = sections.map((section, i) => {
                    const isCurrent = section === this.currentSection;
                    const isCompleted = this.isSectionCompleted(section);
                    const cls = isCurrent ? 'current' : isCompleted ? 'done' : '';
                    return `
                        <button class="topbar__step ${cls}" onclick="survey.goToSection('${section}')" title="${section}">
                            <span class="topbar__step-num">${i + 1}</span>
                            <span class="topbar__step-label">${section}</span>
                        </button>
                    `;
                }).join('');
            }
        }

        const survey = new Survey();
        survey.initialize();

        // Scroll progress indicator
        window.addEventListener('scroll', function() {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            const progressBar = document.getElementById('scrollProgress');
            if (progressBar) {
                progressBar.style.width = scrolled + '%';
            }
        });
    </script>
</body>
</html>
